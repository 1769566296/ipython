    <style>
        :root {
            --primary-color: #ff4500;
            --secondary-color: #4a6baf;
            --text-color: #333;
            --bg-color: #f0f0f0;
            --card-bg: rgba(255, 255, 255, 0.85);
            --shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            --holiday-color: #e74c3c;
            --season-color: #2ecc71;
            --memorial-color: #9b59b6;
            --custom-event-color: #3498db;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 100px;
            color: rgba(0, 0, 0, 0.05);
            pointer-events: none;
            z-index: -1;
            user-select: none;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 2.2em;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        h2, h3 {
            font-size: 1.8em;
            margin: 25px 0 15px;
            color: var(--secondary-color);
        }

        h3 {
            font-size: 1.5em;
            margin: 20px 0 10px;
        }

        .card {
            margin: 20px 0;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        #current-time {
            font-size: 1.5em;
            margin: 15px 0;
            padding: 12px;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .days-counter {
            font-size: 2.8em;
            margin: 10px 0;
            color: var(--primary-color);
            font-weight: bold;
            transition: all 0.5s ease;
        }

        .gradient-animated {
            background: linear-gradient(90deg, 
                #ff0000, #ff7f00, #ffff00, #00ff00, 
                #0000ff, #4b0082, #9400d3, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
            animation: gradientMove 20s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% center; }
            100% { background-position: -200% center; }
        }

        .date-input-container {
            margin: 20px 0;
        }

        .form-input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }

        .form-button {
            padding: 10px 15px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .form-button:hover {
            background-color: #3a5a9a;
        }

        .holiday-container, .custom-events-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .holiday-section {
            margin-bottom: 30px;
        }

        .holiday-section h4 {
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 8px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .holiday-item, .custom-event-item {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            margin-bottom: 10px;
            position: relative;
        }

        .holiday-item:hover, .custom-event-item:hover {
            transform: scale(1.02);
        }

        .holiday-name, .event-name {
            font-weight: bold;
            font-size: 1.1em;
            flex: 1;
        }

        .holiday-date, .event-date {
            color: #666;
            width: 100px;
            text-align: right;
        }

        .days-remaining, .event-days {
            font-weight: bold;
            font-size: 1.2em;
            width: 100px;
            text-align: right;
        }

        .holiday-type-1 { /* 节日 */
            border-left: 4px solid var(--holiday-color);
        }
        .holiday-type-2 { /* 节气 */
            border-left: 4px solid var(--season-color);
        }
        .holiday-type-3 { /* 纪念日 */
            border-left: 4px solid var(--memorial-color);
        }
        .custom-event-item { /* 自定义事件 */
            border-left: 4px solid var(--custom-event-color);
        }

        .event-details {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
            width: 100%;
            display: none;
        }

        .show-details {
            display: block;
        }

        .delete-event {
            position: absolute;
            top: 5px;
            right: 5px;
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 0.8em;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: #666;
            padding: 15px;
            border-top: 1px solid #ddd;
            width: 100%;
        }

        .filter-controls {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
            background-color: #eee;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background-color: var(--secondary-color);
            color: white;
        }

        .custom-event-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .holiday-container, .custom-events-container {

            }
            .holiday-date, .days-remaining, .event-date, .event-days {
                width: auto;
                text-align: left;
                margin-top: 5px;
            }
        }
    </style>
</head>

        // 初始化函数
        function init() {
            // 尝试从本地存储读取数据
            const savedBirthday = localStorage.getItem('birthday');
            const savedEvents = localStorage.getItem('customEvents');
            
            if (savedBirthday) {
                birthdayInput.value = savedBirthday;
                memorialDate = new Date(savedBirthday + 'T00:00:00');
            }
            
            if (savedEvents) {
                customEvents = JSON.parse(savedEvents);
                renderCustomEvents();
            }
            
            setChineseDateInput();
            updateTime();
        }

        // 确保日期选择器显示中文
        function setChineseDateInput() {
            if (navigator.language.includes('zh-CN				')) {
                birthdayInput.valueAsDate = memorialDate;
            }
        }

        // 生日输入变化事件
        birthdayInput.addEventListener('change', function() {
            const newDate = new Date(this.value + 'T00:00:00');
            if (!isNaN(newDate.getTime())) {
                memorialDate = newDate;
                updateTime();
                localStorage.setItem('birthday', this.value);
            }
        });

        // 添加自定义事件
        addEventBtn.addEventListener('click', function() {
            const eventName = document.getElementById('event-name').value.trim();
            const eventDate = document.getElementById('event-date').value;
            const eventDetails = document.getElementById('event-details').value.trim();
            
            if (!eventName || !eventDate) {
                alert('请填写事件名称和日期');
                return;
            }
            
            const newEvent = {
                id: Date.now(),
                name: eventName,
                date: eventDate,
                details: eventDetails
            };
            
            customEvents.push(newEvent);
            saveCustomEvents();
            renderCustomEvents();
            
            // 清空表单
            document.getElementById('event-name').value = '';
            document.getElementById('event-date').value = '';
            document.getElementById('event-details').value = '';
        });

        // 保存自定义事件到本地存储
        function saveCustomEvents() {
            localStorage.setItem('customEvents', JSON.stringify(customEvents));
        }

        // 渲染自定义事件
        function renderCustomEvents() {
            customEventsList.innerHTML = '';
            
            if (customEvents.length === 0) {
                customEventsList.innerHTML = '<p>暂无自定义事件</p>';
                return;
            }
            
            // 按日期排序
            customEvents.sort((a, b) => new Date(a.date) - new Date(b.date));
            
            // 按月份分组
            const eventsByMonth = {};
            const now = new Date();
            
            customEvents.forEach(event => {
                const eventDate = new Date(event.date);
                const month = eventDate.getMonth() + 1;
                
                if (!eventsByMonth[month]) {
                    eventsByMonth[month] = [];
                }
                
                eventsByMonth[month].push(event);
            });
            
            // 渲染事件列表
            Object.keys(eventsByMonth).sort().forEach(month => {
                const monthEvents = eventsByMonth[month];
                const monthName = new Date(2025, month-1, 1).toLocaleDateString('zh-CN', {month: 'long'});
                
                const section = document.createElement('div');
                section.className = 'holiday-section';
                section.innerHTML = `<h4>${monthName}</h4>`;
                
                monthEvents.forEach(event => {
                    const eventDate = new Date(event.date);
                    const daysRemaining = getDaysBetweenDates(now, eventDate);
                    const dateStr = eventDate.toLocaleDateString('zh-CN', {month: 'long', day: 'numeric'});
                    
                    const item = document.createElement('div');
                    item.className = 'custom-event-item';
                    item.innerHTML = `
                        <button class="delete-event" data-id="${event.id}">×</button>
                        <div class="event-name">${event.name}</div>
                        <div class="event-date">${dateStr}</div>
                        <div class="event-days">${daysRemaining >= 0 ? daysRemaining + '天后' : '已过' + Math.abs(daysRemaining) + '天'}</div>
                        ${event.details ? `<div class="event-details">${event.details}</div>` : ''}
                    `;
                    
                    section.appendChild(item);
                });
                
                customEventsList.appendChild(section);
            });
        }

        // 删除自定义事件
        customEventsList.addEventListener('click', function(e) {
            if (e.target.classList.contains('delete-event')) {
                const eventId = parseInt(e.target.getAttribute('data-id'));
                customEvents = customEvents.filter(event => event.id !== eventId);
                saveCustomEvents();
                renderCustomEvents();
            }
        });

        // 筛选按钮点击事件
        filterButtons.forEach(button => {
            button.addEventListener('click', function() {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                updateHolidays();
            });
        });
        
        // 计算两个日期之间的天数差
        function getDaysBetweenDates(date1, date2) {
            const diffTime = date2 - date1;
            return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        }
        
        // 获取下一个生日日期
        function getNextBirthday(birthDate) {
            const now = new Date();
            const currentYear = now.getFullYear();
            
            // 今年的生日
            let nextBirthday = new Date(currentYear, birthDate.getMonth(), birthDate.getDate());
            
            // 如果今年生日已过，计算明年的生日
            if (nextBirthday < now) {
                nextBirthday = new Date(currentYear + 1, birthDate.getMonth(), birthDate.getDate());
            }
            
            return nextBirthday;
        }
        
        // 更新节日倒计时
        function updateHolidays() {
            const now = new Date();
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            
            // 按月份分组
            const holidaysByMonth = {};
            holidays.forEach(holiday => {
                const holidayDate = new Date(holiday.date);
                const daysRemaining = getDaysBetweenDates(now, holidayDate);
                
                if (daysRemaining >= 0) {
                    const month = holidayDate.getMonth() + 1;
                    if (!holidaysByMonth[month]) {
                        holidaysByMonth[month] = [];
                    }
                    
                    // 检查筛选条件
                    let shouldShow = false;
                    switch(activeFilter) {
                        case 'all': shouldShow = true; break;
                        case 'type-1': shouldShow = holiday.type === 1; break;
                        case 'type-2': shouldShow = holiday.type === 2; break;
                        case 'type-3': shouldShow = holiday.type === 3; break;
                        case 'type-4': shouldShow = holiday.type === 4; break;
                    }
                    
                    if (shouldShow) {
                        holidaysByMonth[month].push({
                            ...holiday,
                            daysRemaining,
                            dateStr: holidayDate.toLocaleDateString('zh-CN', {month: 'long', day: 'numeric'})
                        });
                    }
                }
            });
            
            // 渲染节日列表
            holidayContainer.innerHTML = '';
            
            // 按月份排序
            const sortedMonths = Object.keys(holidaysByMonth).sort((a, b) => a - b);
            
            sortedMonths.forEach(month => {
                const monthHolidays = holidaysByMonth[month];
                if (monthHolidays.length > 0) {
                    const monthName = new Date(2025, month-1, 1).toLocaleDateString('zh-CN', {month: 'long'});
                    
                    const section = document.createElement('div');
                    section.className = 'holiday-section';
                    section.innerHTML = `<h4>${monthName}</h4>`;
                    
                    // 按日期排序
                    monthHolidays.sort((a, b) => new Date(a.date) - new Date(b.date));
                    
                    monthHolidays.forEach(holiday => {
                        const item = document.createElement('div');
                        item.className = `holiday-item holiday-type-${holiday.type}`;
                        item.innerHTML = `
                            <div class="holiday-name">${holiday.name}</div>
                            <div class="holiday-date">${holiday.dateStr}</div>
                            <div class="days-remaining">${holiday.daysRemaining}天后</div>
                        `;
                        section.appendChild(item);
                    });
                    
                    holidayContainer.appendChild(section);
                }
            });
        }
        
        // 更新当前时间和天数计算
        function updateTime() {
            const now = new Date();
            
            // 更新当前时间（中文格式）
            currentTimeElement.textContent = '当前时间: ' + now.toLocaleTimeString('zh-CN', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            
            // 计算已活天数
            const diffTime = now - memorialDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            // 更新生日倒计时
            const nextBirthday = getNextBirthday(memorialDate);
            const daysToBirthday = getDaysBetweenDates(now, nextBirthday);
            const nextAge = now.getFullYear() - memorialDate.getFullYear() + (now < nextBirthday ? 0 : 1);
            
            // 添加平滑过渡效果
            daysSinceElement.style.transform = 'scale(1.05)';
            birthdayCountdownElement.style.transform = 'scale(1.05)';
            setTimeout(() => {
                daysSinceElement.style.transform = 'scale(1)';
                birthdayCountdownElement.style.transform = 'scale(1)';
            }, 200);
            
            // 更新DOM
            daysSinceElement.textContent = diffDays.toLocaleString('zh-CN');
            birthdayCountdownElement.textContent = daysToBirthday.toLocaleString('zh-CN');
            nextAgeElement.textContent = nextAge;
            
            // 更新节日和自定义事件倒计时
            updateHolidays();
            renderCustomEvents();
        }
        
        // 启动
        init();
        
        // 每秒更新一次
        setInterval(updateTime, 1000);
    </script>
</body>
